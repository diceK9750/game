<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>NUMBER RUSH Player</title>
    <link rel="stylesheet" href="modern-ui.css?v=chain-impact-1">
    <link rel="stylesheet" href="shiritori-ui.css?v=timed-chain-3">
    <link rel="stylesheet" href="mobile-layout.css?v=2-no-scroll">
    <script src="chain-voice.js?v=cute-voice-2" defer></script>
    <script src="chain-ui.js?v=chain-voice-1" defer></script>
    <script src="rival-cursor.js" defer></script>
    <script src="shiritori-dictionary.js" defer></script>
    <script src="shiritori-ui.js?v=2-no-scroll" defer></script>
    <script src="modern-ui.js?v=chain-voice-1" defer></script>
    <link rel="stylesheet" href="character-layer.css">
    <script src="character-layer.js" defer></script>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #090e19; }
      canvas { touch-action: none; image-rendering: pixelated; }
    </style>
    <script src="https://cdn.jsdelivr.net/gh/kitao/pyxel@v2.9.8/wasm/pyxel.js"></script>
  </head>
  <body>
    <!-- Pyxel owns only this frame, never the parent Safari viewport. -->
    <pyxel-run root="." name="game.py" gamepad="disabled"></pyxel-run>
    <div id="modern-app" hidden></div>
    <div id="character-layer" hidden aria-hidden="true">
      <div id="forest-stage" hidden></div>
      <div class="rival-card rin"><div id="rin-portrait" class="rival-portrait"></div><div class="rival-name">RIN / YOU</div></div>
      <div class="rival-card koh"><div id="koh-portrait" class="rival-portrait"></div><div class="rival-dark-fairy"></div><div class="rival-name">LUNA / CPU</div></div>
    </div>
  </body>
</html>
