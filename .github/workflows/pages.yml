name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test game logic
        run: python -m unittest discover -s tests -v
      - name: Test viewport sizing
        run: node --test tests/*.cjs

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html player.html viewport.js game.py game_logic.py music.py characters.py progress.py ui_text.py ui_glyphs.py THIRD_PARTY.md _site/
          cp character_layer.py character-layer.js character-layer.css _site/
          cp modern_ui.py modern-ui.js modern-ui.css _site/
          cp shiritori.py shiritori-ui.js shiritori-ui.css shiritori-dictionary.js rival-cursor.js _site/
          cp -r assets _site/
          touch _site/.nojekyll
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
